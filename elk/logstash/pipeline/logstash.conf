# =============================================================
# logstash.conf — Pipeline de traitement des logs SafeSchool
#
# Flux : NestJS (TCP port 5044) → Logstash → Elasticsearch
#
# Ce fichier a 3 sections :
#   - input  : d'où viennent les logs
#   - filter : comment on les transforme
#   - output : où on les envoie
# =============================================================

input {
  # Écoute les logs envoyés par NestJS via TCP sur le port 5044
  # Chaque log est une ligne JSON (format json_lines)
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # ── Nettoyage et enrichissement des logs ──────────────────

  # Si le champ "level" existe, on le met en majuscules pour Kibana
  if [level] {
    mutate {
      uppercase => ["level"]
    }
  }

  # On parse le timestamp envoyé par NestJS
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # On ajoute un tag selon le type de log pour faciliter les filtres dans Kibana
  if [type] == "http_request" {
    mutate { add_tag => ["http"] }
  }

  if [type] == "auth_event" {
    mutate { add_tag => ["auth"] }
  }

  if [type] == "report_event" {
    mutate { add_tag => ["report"] }
  }

  if [type] == "scoring_event" {
    mutate { add_tag => ["scoring"] }
  }

  if [level] == "ERROR" {
    mutate { add_tag => ["error"] }
  }
}

output {
  # ── Envoi vers Elasticsearch ──────────────────────────────
  # Un index par jour : safeschool-logs-2026.04.15
  # La politique ILM supprimera automatiquement les logs de plus de 30 jours
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "safeschool-logs-%{+YYYY.MM.dd}"
  }

  # ── Affichage dans la console Logstash (debug) ─────────────
  # Utile pour vérifier que les logs arrivent bien
  stdout {
    codec => rubydebug
  }
}

input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  if [level] {
    mutate { uppercase => ["level"] }
  }
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }
  if [type] == "http_request"  { mutate { add_tag => ["http"] } }
  if [type] == "auth_event"    { mutate { add_tag => ["auth"] } }
  if [type] == "report_event"  { mutate { add_tag => ["report"] } }
  if [type] == "scoring_event" { mutate { add_tag => ["scoring"] } }
  if [level] == "ERROR"        { mutate { add_tag => ["error"] } }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "safeschool-logs-%{+YYYY.MM.dd}"
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
  }
  stdout {
    codec => rubydebug
  }
}

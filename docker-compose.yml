# ════════════════════════════════════════════════════════════════════
#  Base commune (dev + prod).
#  - dev  : `make dev`  -> base + docker-compose.override.yml (auto)
#           frontend Vite + backend en watch, pas de nginx.
#  - prod : `make prod` -> base + docker-compose.prod.yml
#           backend compilé + nginx (TLS), pas de serveur de dev.
#  Les parties spécifiques (target de build, ports, montages, nginx)
#  vivent dans les fichiers d'overlay.
# ════════════════════════════════════════════════════════════════════

services:

# == BACKEND =================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safeschool_backend
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      logstash:
        condition: service_healthy
    networks:
      - safeschool_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


# == BASE DE DONNÉES =========================================
  database:
    image: postgres:15-alpine
    container_name: safeschool_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - safeschool_network


# == Logs et monitoring ================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: safeschool_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9201:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - safeschool_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: safeschool_logstash
    ports:
      - "5044:5044"
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - safeschool_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: safeschool_kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - kibanadata:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - safeschool_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s


# == VOLUMES =================================================
volumes:
  pgdata:
  esdata:
  kibanadata:
  frontend_node_modules:
  backend_node_modules:


# == RÉSEAU ==================================================
networks:
  safeschool_network:
    driver: bridge

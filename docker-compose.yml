# version: '3.8'
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safeschool_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # BUGFIX: REACT_APP_API_URL supprimée — convention Create React App obsolète.
    # Vite n'expose que les variables préfixées VITE_
    depends_on:
      - backend
    networks:
      - safeschool_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safeschool_backend
    ports:
      - "5000:3000"
    volumes:
      - backend_node_modules:/app/node_modules
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      logstash:
        condition: service_started
    networks:
      - safeschool_network

  database:
    image: postgres:15-alpine
    container_name: safeschool_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - safeschool_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: safeschool_pgadmin
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@safeschool.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    volumes:
      - pgadmindata:/var/lib/pgadmin
    depends_on:
      - database
    networks:
      - safeschool_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: safeschool_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9201:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - safeschool_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: safeschool_logstash
    ports:
      - "5044:5044"
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline
      #  logstash_data:/usr/share/logstash/data 
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - safeschool_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: safeschool_kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - kibanadata:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - safeschool_network

volumes:
  pgdata:
  esdata:
  kibanadata:
  frontend_node_modules:
  backend_node_modules:
  pgadmindata:

networks:
  safeschool_network:
    driver: bridge



















































    
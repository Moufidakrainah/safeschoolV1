version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safeschool_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - safeschool_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safeschool_backend
    ports:
      - "5000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - safeschool_network

  database:
    image: postgres:15-alpine
    container_name: safeschool_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - safeschool_network
  pgadmin:
      image: dpage/pgadmin4
      container_name: safeschool_pgadmin
      ports:
        - "8080:80"
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@safeschool.com
        PGADMIN_DEFAULT_PASSWORD: admin123
      depends_on:
        - database
      networks:
        - safeschool_network
volumes:
  pgdata:

networks:
  safeschool_network:
    driver: bridge

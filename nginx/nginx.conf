# ── Reverse proxy + terminaison TLS (production uniquement) ──────────────
# nginx sert le frontend (build statique) et redirige les appels API,
# uploads et websockets vers le backend, le tout sur une seule origine.
# Le backend ne voit que du HTTP interne ; TLS s'arrête ici.

# HTTP -> redirection HTTPS
server {
    listen 80;
    server_name _;
    # Le port 443 est publié en 8443 (conteneur rootless), donc on redirige
    # explicitement vers 8443 ; sinon $host pointe vers 443 (non publié)
    return 301 https://$host:8443$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Autorise l'upload d'avatars (multer côté backend)
    client_max_body_size 10M;

    # ── API REST : routes portées par les contrôleurs NestJS ──
    location ~ ^/(users|auth|reports|classes|parents|notifications|student-profiles|staff-profiles|uploads)(/|$) {
        proxy_pass http://backend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (socket.io / quiz temps réel) ──
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA React : tout le reste -> index.html (routing client) ──
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
